<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldLustre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Subtle Inner Dark Gradient -->
    <radialGradient id="darkObsidian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
  </defs>

  <!-- Obsidian Octagonal/Rounded Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#darkObsidian)" stroke="url(#goldLustre)" stroke-width="2.5" />
  
  <!-- Fine Inner Gold Hairline Frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="url(#goldLustre)" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="2 1.5" />

  <!-- Stylized Fountain Pen Nib Symbol & Folded Parchment -->
  <g transform="translate(32, 31)">
    <!-- Parchment Pages Wings -->
    <path d="M-18,6 C-12,0 -4,2 0,6 C4,2 12,0 18,6 L15,10 C10,6 4,7 0,10 C-4,7 -10,6 -15,10 Z" fill="url(#goldLustre)" opacity="0.8" />
    
    <!-- Central Pen Nib Body -->
    <path d="M0,-19 L9,-4 C10,3 7,9 4,11 L0,15 L-4,11 C-7,9 -10,3 -9,-4 Z" fill="url(#goldLustre)" />
    
    <!-- Pen Nib Inset & Breather Hole -->
    <circle cx="0" cy="-3" r="2.2" fill="#0A0A0A" />
    <path d="M0,-3 L0,-19" stroke="#0A0A0A" stroke-width="1.2" stroke-linecap="round" />
    <path d="M0,-1 L0,14" stroke="#0A0A0A" stroke-width="1" />
  </g>

  <!-- Elegant Monogram Accent Letters 'R' and 'S' -->
  <text x="13.5" y="47" font-family="'Plus Jakarta Sans', serif" font-weight="800" font-size="10.5" fill="url(#goldLustre)" letter-spacing="0.5">R</text>
  <text x="43" y="47" font-family="'Plus Jakarta Sans', serif" font-weight="800" font-size="10.5" fill="url(#goldLustre)" letter-spacing="0.5">S</text>
  
  <!-- Tiny Gold Star Accent at top -->
  <polygon points="32,8.5 33,11 35.5,11.5 33.5,13 34,15.5 32,14 30,15.5 30.5,13 28.5,11.5 31,11" fill="url(#goldLustre)" />
</svg>
